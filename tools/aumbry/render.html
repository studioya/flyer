<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./npm/package/build/three.module.js","three/addons/":"./npm/package/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
const P = Object.fromEntries(new URLSearchParams(location.search));
const W = +P.w || 1600, H = +P.h || 1200;
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = +P.exp || 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.setClearColor(0x000000, 0); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = +P.env || 0.55;

const ix = await (await fetch('model.json')).json();
const buf = await (await fetch('model.bin')).arrayBuffer();
const arr = (k, key) => { const [o, n] = ix[k][key]; return key === 'F' ? new Uint32Array(buf, o, n) : new Float32Array(buf, o, n); };
const tex = await new THREE.TextureLoader().loadAsync('oak.jpg');
tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
const S = 1 / 420; // the 480px oak swatch spans ~420 mm
tex.repeat.set(S, S);
const mats = {
  wood: new THREE.MeshStandardMaterial({ map: tex, roughness: 0.62, color: new THREE.Color(P.oak || '#ffffff') }),
  dowels: new THREE.MeshStandardMaterial({ color: '#f2f0ea', roughness: 0.7 }),
  aluminium: new THREE.MeshStandardMaterial({ color: '#1d1d1f', roughness: 0.38, metalness: 0.75 }),
};
const center = new THREE.Vector3(9572, -2165, -596);
for (const k of Object.keys(ix)) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(arr(k, 'V'), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(arr(k, 'N'), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(arr(k, 'T'), 2));
  g.setIndex(new THREE.BufferAttribute(arr(k, 'F'), 1));
  g.translate(-center.x, -center.y, -center.z);
  const m = new THREE.Mesh(g, mats[k]); m.castShadow = m.receiveShadow = true; scene.add(m);
}
// ground: shadow only, so the page ground shows through
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), new THREE.ShadowMaterial({ opacity: +P.sh || 0.22 }));
ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.HemisphereLight('#fffaf2', '#d8cbb8', +P.hemi || 0.6));
const key = new THREE.DirectionalLight('#fff6ea', +P.key || 2.2);
const ka = (+P.ka || -35) * Math.PI / 180, ke = (+P.ke || 50) * Math.PI / 180;
key.position.set(3000 * Math.sin(ka) * Math.cos(ke), -3000 * Math.cos(ka) * Math.cos(ke), 3000 * Math.sin(ke));
key.castShadow = true; key.shadow.mapSize.set(4096, 4096); key.shadow.radius = +P.blur || 12; key.shadow.blurSamples = 25;
Object.assign(key.shadow.camera, { left: -1500, right: 1500, top: 1500, bottom: -1500, near: 100, far: 8000 });
key.shadow.bias = -0.0002; scene.add(key);
// camera: az (deg, 0 = front), el (deg), dist, target, fov
const az = (+P.az || 0) * Math.PI / 180, el = (+P.el || 8) * Math.PI / 180, dist = +P.dist || 3600;
const tgt = new THREE.Vector3(+P.tx || 0, +P.ty || 0, P.tz !== undefined ? +P.tz : 545);
const cam = new THREE.PerspectiveCamera(+P.fov || 30, W / H, 10, 30000);
cam.position.set(tgt.x + dist * Math.sin(az) * Math.cos(el), tgt.y - dist * Math.cos(az) * Math.cos(el), tgt.z + dist * Math.sin(el));
cam.lookAt(tgt);
const SS = +P.ss || 2; // supersample
renderer.setSize(W * SS, H * SS); renderer.domElement.style.width = W + 'px';
const comp = new EffectComposer(renderer);
comp.setSize(W * SS, H * SS);
comp.addPass(new RenderPass(scene, cam));
const ao = new GTAOPass(scene, cam, W * SS, H * SS);
ao.updateGtaoMaterial({ radius: +P.aor || 0.25 * 1000 / 1000 * 60, distanceExponent: 1, thickness: 10, scale: 1, samples: 16 });
ao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
ao.blendIntensity = +P.aoi || 1.0;
comp.addPass(ao);
comp.addPass(new OutputPass());
comp.render();
// downsample into a W x H canvas
const out = document.createElement('canvas'); out.width = W; out.height = H; out.id = 'out';
const c2 = out.getContext('2d'); c2.imageSmoothingQuality = 'high'; c2.drawImage(renderer.domElement, 0, 0, W, H);
document.body.appendChild(out);
window.DONE = true;
</script></body></html>
